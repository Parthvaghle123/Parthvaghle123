<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 90" width="100%" height="100%">
  <defs>
    <linearGradient id="footer-bg" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <linearGradient id="footer-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0"/>
      <stop offset="25%" stop-color="#701A3D"/>
      <stop offset="50%" stop-color="#C77B9B"/>
      <stop offset="75%" stop-color="#701A3D"/>
      <stop offset="100%" stop-color="#451126" stop-opacity="0"/>
    </linearGradient>

    <linearGradient id="footer-pulse-beam" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#451126" stop-opacity="0"/>
      <stop offset="48%" stop-color="#C77B9B" stop-opacity="0.2"/>
      <stop offset="50%" stop-color="#F8F0F3" stop-opacity="0.9"/>
      <stop offset="52%" stop-color="#C77B9B" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#451126" stop-opacity="0"/>
      <animate attributeName="x1" values="-100%;150%" dur="4.2s" repeatCount="indefinite"/>
      <animate attributeName="x2" values="0%;250%" dur="4.2s" repeatCount="indefinite"/>
    </linearGradient>
  </defs>

  <style>
    .mono-text {
      font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace;
    }
    .sans-text {
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
    }
  </style>

  <!-- Container -->
  <rect width="840" height="90" rx="12" fill="url(#footer-bg)" stroke="#451126" stroke-width="1.2"/>

  <!-- Top Decorative Scanning Accent Line -->
  <line x1="20" y1="2" x2="820" y2="2" stroke="url(#footer-line)" stroke-width="1.5"/>
  <line x1="20" y1="2" x2="820" y2="2" stroke="url(#footer-pulse-beam)" stroke-width="2"/>

  <!-- Left: Status Indicator -->
  <g transform="translate(34, 45)">
    <circle cx="0" cy="0" r="8" fill="#190B12" stroke="#701A3D" stroke-width="1.2"/>
    <circle cx="0" cy="0" r="4" fill="#C77B9B">
      <animate attributeName="r" values="3;4.8;3" dur="2.4s" repeatCount="indefinite"/>
      <animate attributeName="opacity" values="0.6;1;0.6" dur="2.4s" repeatCount="indefinite"/>
    </circle>
  </g>

  <!-- Editorial Statement -->
  <text x="54" y="42" class="mono-text" font-size="11.5" font-weight="600" fill="#E5B5C7" letter-spacing="1.2">
    DESIGNED WITH INTENTION // ARCHITECTED FOR SCALE
  </text>
  <text x="54" y="62" class="sans-text" font-size="12" fill="#C77B9B" opacity="0.85">
    Parth Vaghela • MERN Stack &amp; Flutter Developer • Open for impactful engineering opportunities
  </text>

  <!-- Right: Technical Stamp -->
  <rect x="686" y="32" width="120" height="26" rx="6" fill="#190B12" stroke="#701A3D" stroke-width="1"/>
  <text x="746" y="49" class="mono-text" font-size="10" font-weight="600" fill="#E5B5C7" text-anchor="middle" letter-spacing="1">
    2026 // EDITION
  </text>
</svg>
