<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 470" width="100%" height="100%">
  <defs>
    <linearGradient id="prj-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <pattern id="prj-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#701A3D" stroke-width="0.7" stroke-opacity="0.16"/>
    </pattern>

    <radialGradient id="prj-glow" cx="85%" cy="20%" r="50%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.38"/>
      <stop offset="60%" stop-color="#451126" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="prj-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3"/>
      <stop offset="60%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Container -->
  <rect width="840" height="470" rx="14" fill="url(#prj-bg)" stroke="#451126" stroke-width="1.5"/>
  <rect width="840" height="470" rx="14" fill="url(#prj-glow)"/>
  <rect width="840" height="470" rx="14" fill="url(#prj-grid)"/>

  <!-- Corner Brackets -->
  <path d="M 14 24 L 14 14 L 24 14" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 826 24 L 826 14 L 816 14" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 14 446 L 14 456 L 24 456" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 826 446 L 826 456 L 816 456" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>

  <!-- Section Pill -->
  <rect x="40" y="24" width="245" height="24" rx="12" fill="#190B12" stroke="#701A3D" stroke-width="1"/>
  <circle cx="52" cy="36" r="3.5" fill="#C77B9B">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.3s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="39.5" class="font-mono" font-size="10" font-weight="600" fill="#E5B5C7" letter-spacing="1.2">PORTFOLIO // SELECTED PROJECTS</text>

  <!-- Project 1: PayFlow -->
  <g transform="translate(40, 64)">
    <rect width="760" height="70" rx="8" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="16" y="26" class="font-sans" font-size="15" font-weight="700" fill="#F8F0F3">💳 PayFlow – Money Transfer Management System</text>
    <rect x="635" y="10" width="110" height="22" rx="4" fill="#451126"/>
    <text x="690" y="25" class="font-mono" font-size="10" font-weight="600" fill="#E5B5C7" text-anchor="middle">LIVE PLATFORM</text>
    <text x="16" y="46" class="font-sans" font-size="11.5" fill="#E5B5C7">Secure financial ops, multi-bank accounts, cash denominations, reports, and JWT refresh token auth.</text>
    <text x="16" y="62" class="font-mono" font-size="10" fill="#C77B9B">Next.js • React • TypeScript • Tailwind CSS • ShadCN UI • Node.js • Express • MongoDB • Hybrid Cache</text>
  </g>

  <!-- Project 2: Dentcare360 -->
  <g transform="translate(40, 144)">
    <rect width="760" height="70" rx="8" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="16" y="26" class="font-sans" font-size="15" font-weight="700" fill="#F8F0F3">🏥 Dentcare360 – Dental Clinic Management System</text>
    <rect x="635" y="10" width="110" height="22" rx="4" fill="#451126"/>
    <text x="690" y="25" class="font-mono" font-size="10" font-weight="600" fill="#E5B5C7" text-anchor="middle">LIVE PLATFORM</text>
    <text x="16" y="46" class="font-sans" font-size="11.5" fill="#E5B5C7">Role-based clinic system managing patients, appointments, consultations, treatments, invoices &amp; RBAC.</text>
    <text x="16" y="62" class="font-mono" font-size="10" fill="#C77B9B">Next.js • React • TypeScript • Tailwind CSS • ShadCN UI • Node.js • Express • MongoDB • RBAC</text>
  </g>

  <!-- Project 3: SmartCalc -->
  <g transform="translate(40, 224)">
    <rect width="760" height="70" rx="8" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="16" y="26" class="font-sans" font-size="15" font-weight="700" fill="#F8F0F3">📈 SmartCalc – Financial Calculator Mobile App</text>
    <rect x="635" y="10" width="110" height="22" rx="4" fill="#701A3D"/>
    <text x="690" y="25" class="font-mono" font-size="10" font-weight="600" fill="#F8F0F3" text-anchor="middle">PLAY STORE</text>
    <text x="16" y="46" class="font-sans" font-size="11.5" fill="#E5B5C7">Offline EMI, SIP, GST, Loan &amp; Discount calculators with Firestore, Analytics, Crashlytics &amp; AdMob.</text>
    <text x="16" y="62" class="font-mono" font-size="10" fill="#C77B9B">Flutter • Dart • Firebase • Cloud Firestore • Provider • Riverpod • Crashlytics • AdMob</text>
  </g>

  <!-- Project 4: Flipix -->
  <g transform="translate(40, 304)">
    <rect width="760" height="70" rx="8" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="16" y="26" class="font-sans" font-size="15" font-weight="700" fill="#F8F0F3">🃏 Flipix – Multiplayer Memory Card Game</text>
    <rect x="635" y="10" width="110" height="22" rx="4" fill="#701A3D"/>
    <text x="690" y="25" class="font-mono" font-size="10" font-weight="600" fill="#F8F0F3" text-anchor="middle">PLAY STORE</text>
    <text x="16" y="46" class="font-sans" font-size="11.5" fill="#E5B5C7">Real-time multiplayer matching with Google Sign-In, Firestore game state, animations &amp; Riverpod.</text>
    <text x="16" y="62" class="font-mono" font-size="10" fill="#C77B9B">Flutter • Dart • Firebase • Firestore • Google Sign-In • Provider • Riverpod • AdMob</text>
  </g>

  <!-- Project 5: Explore Animal Sounds -->
  <g transform="translate(40, 384)">
    <rect width="760" height="70" rx="8" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="16" y="26" class="font-sans" font-size="15" font-weight="700" fill="#F8F0F3">🦁 Explore Animal Sounds – Educational App</text>
    <rect x="635" y="10" width="110" height="22" rx="4" fill="#701A3D"/>
    <text x="690" y="25" class="font-mono" font-size="10" font-weight="600" fill="#F8F0F3" text-anchor="middle">PLAY STORE</text>
    <text x="16" y="46" class="font-sans" font-size="11.5" fill="#E5B5C7">Early-learning app with real animal audio playback, HD visuals, and dynamic multi-language Firestore data.</text>
    <text x="16" y="62" class="font-mono" font-size="10" fill="#C77B9B">Flutter • Dart • Cloud Firestore • Native Audio Player • Multi-Language Support • AdMob</text>
  </g>
</svg>
