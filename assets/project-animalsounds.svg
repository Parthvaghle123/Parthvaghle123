<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="as-t">
  <title id="as-t">Kiddo Learn &amp; Play: Educational Flutter mobile app for toddlers and young children.</title>
  <defs>
    <linearGradient id="as-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="as-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="as-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <filter id="as-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="as-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="as-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .as-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .as-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .as-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .as-in { animation: as-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .as-d1 { animation-delay: .15s; } .as-d2 { animation-delay: .4s; }
    .as-chip { animation: as-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes as-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .as-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: as-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes as-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes as-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .as-in, .as-chip { animation: none; } .as-draw { animation: none; stroke-dashoffset: 0; } }
    .as-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: as-trace 7s linear infinite; }
    @keyframes as-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .as-trace { display: none; } }
  </style>
  <g clip-path="url(#as-clip)">
    <rect width="1200" height="370" fill="url(#as-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#as-grid)"/>
    <rect width="1200" height="370" fill="url(#as-glow)"/>
    <g class="as-in as-d1">
      <text class="as-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">05 · MOBILE APP · FLUTTER · 2026</text>
      <text class="as-serif" x="54" y="126" font-size="46" font-weight="300" letter-spacing="-1" fill="#F8F0F3">Kiddo Learn &amp; Play</text>
      <text class="as-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Educational early-learning app with real animal audio, HD visuals &amp; languages.</text>
      <text class="as-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> Multi-language speech, native audio player, dynamic Firestore &amp; AdMob</text>
      <line class="as-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="as-serif" font-size="34" font-weight="300" fill="#F8F0F3">Multi-Lang</text><text class="as-sans" y="24" font-size="12.5" fill="#B6A3AC">multi-language pronunciations</text></g>
      <g transform="translate(261 266)"><text class="as-serif" font-size="34" font-weight="300" fill="#F8F0F3">HD Audio</text><text class="as-sans" y="24" font-size="12.5" fill="#B6A3AC">crystal-clear animal recordings</text></g>
      <g transform="translate(466 266)"><text class="as-serif" font-size="34" font-weight="300" fill="#F8F0F3">Play Store</text><text class="as-sans" y="24" font-size="12.5" fill="#B6A3AC">com.explore.animalsound</text></g>
      <g class="as-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="as-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Flutter</text></g>
      <g class="as-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="55" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="as-mono" x="161" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Dart</text></g>
      <g class="as-chip" style="animation-delay:1.24s"><rect x="197" y="314" width="76" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="as-mono" x="235" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Firebase</text></g>
      <g class="as-chip" style="animation-delay:1.36s"><rect x="281" y="314" width="78" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="as-mono" x="320" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Firestore</text></g>
      <g class="as-chip" style="animation-delay:1.48s"><rect x="367" y="314" width="96" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="as-mono" x="415" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Audio Player</text></g>
      <g class="as-chip" style="animation-delay:1.60s"><rect x="471" y="314" width="65" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="as-mono" x="503" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">AdMob</text></g>
    </g>
    <g class="as-in as-d2"><g transform="translate(0 35)">
      <g transform="translate(760 40)" class="as-mono" font-size="13" text-anchor="middle">
        <text x="12" y="20" text-anchor="start" font-size="10.5" letter-spacing="2.4" fill="#B6A3AC">NATIVE AUDIO · FIRESTORE · MULTI-LANG</text>
        <!-- Sound Wave & Animal Icon Visual -->
        <g transform="translate(90 50)">
          <!-- Sound Visualizer Bars -->
          <rect x="0" y="50" width="8" height="30" rx="4" fill="#C77B9B"><animate attributeName="height" values="30;70;30" dur="1.2s" repeatCount="indefinite"/><animate attributeName="y" values="50;30;50" dur="1.2s" repeatCount="indefinite"/></rect>
          <rect x="16" y="35" width="8" height="60" rx="4" fill="#E5B5C7"><animate attributeName="height" values="60;20;60" dur="1.0s" repeatCount="indefinite"/><animate attributeName="y" values="35;55;35" dur="1.0s" repeatCount="indefinite"/></rect>
          <rect x="32" y="20" width="8" height="90" rx="4" fill="#F8F0F3"><animate attributeName="height" values="90;40;90" dur="1.4s" repeatCount="indefinite"/><animate attributeName="y" values="20;45;20" dur="1.4s" repeatCount="indefinite"/></rect>
          <rect x="48" y="40" width="8" height="50" rx="4" fill="#E5B5C7"><animate attributeName="height" values="50;85;50" dur="0.9s" repeatCount="indefinite"/><animate attributeName="y" values="40;22;40" dur="0.9s" repeatCount="indefinite"/></rect>
          <rect x="64" y="55" width="8" height="20" rx="4" fill="#C77B9B"><animate attributeName="height" values="20;60;20" dur="1.3s" repeatCount="indefinite"/><animate attributeName="y" values="55;35;55" dur="1.3s" repeatCount="indefinite"/></rect>

          <!-- Audio Bubble -->
          <rect x="100" y="30" width="130" height="70" rx="14" fill="#451126" stroke="#E5B5C7"/>
          <text x="165" y="60" font-size="13" fill="#F8F0F3" text-anchor="middle">Lion Roar ♫</text>
          <text x="165" y="80" font-size="10" fill="#E5B5C7" text-anchor="middle">Playing 44.1kHz</text>
        </g>
        <text x="12" y="236" text-anchor="start" font-size="10.5" letter-spacing="1.5" fill="#B6A3AC">Interactive early education with toddler-friendly UI</text>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="as-trace" style="animation-delay:-5.2s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#as-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
