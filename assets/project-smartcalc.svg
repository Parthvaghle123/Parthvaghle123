<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 370" width="1200" height="370" role="img" aria-labelledby="sc-t">
  <title id="sc-t">SmartCalc: Flutter financial calculator application with offline calculation engines.</title>
  <defs>
    <linearGradient id="sc-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#190B12"/><stop offset="1" stop-color="#10070C"/>
    </linearGradient>
    <radialGradient id="sc-glow" cx="82%" cy="30%" r="55%">
      <stop offset="0" stop-color="#701A3D" stop-opacity=".7"/><stop offset="1" stop-color="#451126" stop-opacity="0"/>
    </radialGradient>
    <pattern id="sc-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M28 0H0V28" fill="none" stroke="#C77B9B" stroke-opacity=".07"/>
    </pattern>
    <filter id="sc-glowf" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="3" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="sc-clip"><rect width="1200" height="370" rx="18"/></clipPath>
    <linearGradient id="sc-trace" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F8F0F3"/><stop offset=".45" stop-color="#E5B5C7"/><stop offset="1" stop-color="#C77B9B" stop-opacity="0"/>
    </linearGradient>
  </defs>
  <style>
    .sc-serif { font-family: Georgia, "Iowan Old Style", "Palatino Linotype", "Times New Roman", serif; }
    .sc-mono { font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, "Liberation Mono", monospace; }
    .sc-sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Helvetica, Arial, sans-serif; }
    .sc-in { animation: sc-in 1.2s cubic-bezier(.16,1,.3,1) both; }
    .sc-d1 { animation-delay: .15s; } .sc-d2 { animation-delay: .4s; }
    .sc-chip { animation: sc-chip .7s cubic-bezier(.34,1.56,.64,1) both; }
    @keyframes sc-chip { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
    .sc-draw { stroke-dasharray: 600; stroke-dashoffset: 600; animation: sc-draw 2s cubic-bezier(.65,0,.35,1) .5s forwards; }
    @keyframes sc-in { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: none; } }
    @keyframes sc-draw { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .sc-in, .sc-chip { animation: none; } .sc-draw { animation: none; stroke-dashoffset: 0; } }
    .sc-trace { stroke-dasharray: 564 3136; stroke-dashoffset: 3700; animation: sc-trace 7s linear infinite; }
    @keyframes sc-trace { to { stroke-dashoffset: 0; } }
    @media (prefers-reduced-motion: reduce) { .sc-trace { display: none; } }
  </style>
  <g clip-path="url(#sc-clip)">
    <rect width="1200" height="370" fill="url(#sc-bg)"/>
    <rect x="720" width="480" height="370" fill="url(#sc-grid)"/>
    <rect width="1200" height="370" fill="url(#sc-glow)"/>
    <g class="sc-in sc-d1">
      <text class="sc-mono" x="56" y="62" font-size="12" letter-spacing="2.6" fill="#C77B9B">03 · MOBILE APP · FLUTTER · 2026</text>
      <text class="sc-serif" x="54" y="126" font-size="52" font-weight="300" letter-spacing="-1.5" fill="#F8F0F3">SmartCalc</text>
      <text class="sc-sans" x="56" y="166" font-size="17" fill="#B6A3AC">Financial calculator mobile app for EMI, SIP, GST, loan &amp; discount math.</text>
      <text class="sc-mono" x="56" y="200" font-size="12.5" fill="#E5B5C7"><tspan fill="#C77B9B">BUILT ›</tspan> Material UI, offline financial math, Firebase Firestore, Crashlytics &amp; AdMob</text>
      <line class="sc-draw" x1="56" y1="226" x2="680" y2="226" stroke="#C77B9B" stroke-opacity=".3"/>
      <g transform="translate(56 266)"><text class="sc-serif" font-size="34" font-weight="300" fill="#F8F0F3">5-in-1</text><text class="sc-sans" y="24" font-size="12.5" fill="#B6A3AC">calculators in one app</text></g>
      <g transform="translate(261 266)"><text class="sc-serif" font-size="34" font-weight="300" fill="#F8F0F3">Offline</text><text class="sc-sans" y="24" font-size="12.5" fill="#B6A3AC">zero-latency local engines</text></g>
      <g transform="translate(466 266)"><text class="sc-serif" font-size="34" font-weight="300" fill="#F8F0F3">Play Store</text><text class="sc-sans" y="24" font-size="12.5" fill="#B6A3AC">in.khodal.smartcalc</text></g>
      <g class="sc-chip" style="animation-delay:1.00s"><rect x="56" y="314" width="70" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sc-mono" x="91" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Flutter</text></g>
      <g class="sc-chip" style="animation-delay:1.12s"><rect x="134" y="314" width="55" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sc-mono" x="161" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Dart</text></g>
      <g class="sc-chip" style="animation-delay:1.24s"><rect x="197" y="314" width="76" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sc-mono" x="235" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Firebase</text></g>
      <g class="sc-chip" style="animation-delay:1.36s"><rect x="281" y="314" width="78" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sc-mono" x="320" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Firestore</text></g>
      <g class="sc-chip" style="animation-delay:1.48s"><rect x="367" y="314" width="74" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sc-mono" x="404" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Provider</text></g>
      <g class="sc-chip" style="animation-delay:1.60s"><rect x="449" y="314" width="74" height="26" rx="13" fill="#27101C" stroke="#C77B9B" stroke-opacity=".35"/><text class="sc-mono" x="486" y="331" text-anchor="middle" font-size="11.5" fill="#E5B5C7">Riverpod</text></g>
    </g>
    <g class="sc-in sc-d2"><g transform="translate(0 35)">
      <g transform="translate(760 40)" class="sc-mono" font-size="13" text-anchor="middle">
        <text x="12" y="20" text-anchor="start" font-size="10.5" letter-spacing="2.4" fill="#B6A3AC">EMI · SIP · GST · LOAN CALCULATIONS</text>
        <!-- Calculator & Chart mock -->
        <g transform="translate(30 40)">
          <!-- Mobile device frame -->
          <rect x="70" y="0" width="160" height="200" rx="18" fill="#190B12" stroke="#C77B9B" stroke-opacity=".5"/>
          <rect x="85" y="15" width="130" height="40" rx="8" fill="#27101C" stroke="#E5B5C7" stroke-opacity=".4"/>
          <text x="100" y="38" font-size="16" fill="#F8F0F3">₹ 48,250</text>
          <!-- Compound interest curve -->
          <path d="M90 140 Q 140 130, 200 80" fill="none" stroke="#E5B5C7" stroke-width="2.5"/>
          <circle cx="200" cy="80" r="4" fill="#F8F0F3" filter="url(#sc-glowf)"/>
          <rect x="90" y="160" width="35" height="22" rx="4" fill="#451126"/>
          <rect x="132" y="160" width="35" height="22" rx="4" fill="#27101C"/>
          <rect x="175" y="160" width="35" height="22" rx="4" fill="#701A3D"/>
        </g>
        <text x="12" y="236" text-anchor="start" font-size="10.5" letter-spacing="1.5" fill="#B6A3AC">State management via Provider &amp; Riverpod</text>
      </g>
    </g></g>
    <rect x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="#C77B9B" stroke-opacity=".2"/>
    <rect class="sc-trace" style="animation-delay:-3.5s" x=".5" y=".5" width="1199" height="369" rx="17.5" fill="none" stroke="url(#sc-trace)" stroke-width="1.6" stroke-linecap="round"/>
  </g>
</svg>
