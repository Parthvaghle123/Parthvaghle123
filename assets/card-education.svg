<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 190" width="100%" height="100%">
  <defs>
    <linearGradient id="edu-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <pattern id="edu-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#701A3D" stroke-width="0.7" stroke-opacity="0.16"/>
    </pattern>

    <radialGradient id="edu-glow" cx="75%" cy="30%" r="45%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#451126" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="edu-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3"/>
      <stop offset="60%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Container -->
  <rect width="840" height="190" rx="14" fill="url(#edu-bg)" stroke="#451126" stroke-width="1.5"/>
  <rect width="840" height="190" rx="14" fill="url(#edu-glow)"/>
  <rect width="840" height="190" rx="14" fill="url(#edu-grid)"/>

  <!-- Corner Brackets -->
  <path d="M 14 24 L 14 14 L 24 14" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 826 24 L 826 14 L 816 14" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 14 166 L 14 176 L 24 176" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 826 166 L 826 176 L 816 176" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>

  <!-- Section Pill -->
  <rect x="40" y="24" width="220" height="24" rx="12" fill="#190B12" stroke="#701A3D" stroke-width="1"/>
  <circle cx="52" cy="36" r="3.5" fill="#C77B9B">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.4s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="39.5" class="font-mono" font-size="10" font-weight="600" fill="#E5B5C7" letter-spacing="1.2">ACADEMICS // EDUCATION</text>

  <!-- Degree & University -->
  <text x="40" y="80" class="font-sans" font-size="20" font-weight="700" fill="url(#edu-title-grad)">
    Bachelor of Computer Applications (BCA)
  </text>
  <text x="40" y="104" class="font-sans" font-size="13.5" font-weight="500" fill="#E5B5C7">
    Veer Narmad South Gujarat University (VNSGU) • Graduated: 2026
  </text>

  <!-- CGPA Badge -->
  <rect x="650" y="66" width="150" height="36" rx="8" fill="#190B12" stroke="#701A3D" stroke-width="1.2"/>
  <text x="725" y="89" class="font-mono" font-size="13" font-weight="700" fill="#F8F0F3" text-anchor="middle">
    CGPA: 7.5 / 10
  </text>

  <!-- Core Curriculum -->
  <circle cx="48" cy="132" r="3" fill="#C77B9B"/>
  <text x="62" y="136" class="font-sans" font-size="12.5" fill="#F8F0F3">
    Specialized coursework in Data Structures &amp; Algorithms, Object-Oriented Systems, Web Engineering, and Databases.
  </text>

  <!-- Bottom Divider Line -->
  <line x1="40" y1="158" x2="800" y2="158" stroke="#451126" stroke-width="0.8" stroke-dasharray="4 4" opacity="0.6"/>
  <text x="40" y="174" class="font-mono" font-size="9.5" fill="#701A3D" font-weight="600" letter-spacing="0.8">AFFILIATED WITH VNSGU SURAT</text>
  <text x="690" y="174" class="font-mono" font-size="9.5" fill="#E5B5C7" font-weight="600" letter-spacing="0.8">DEGREE CONFERRED: 2026</text>
</svg>
