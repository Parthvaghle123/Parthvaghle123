<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 840 330" width="100%" height="100%">
  <defs>
    <linearGradient id="sk-bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10070C"/>
      <stop offset="50%" stop-color="#190B12"/>
      <stop offset="100%" stop-color="#10070C"/>
    </linearGradient>

    <pattern id="sk-grid" width="28" height="28" patternUnits="userSpaceOnUse">
      <path d="M 28 0 L 0 0 0 28" fill="none" stroke="#701A3D" stroke-width="0.7" stroke-opacity="0.16"/>
    </pattern>

    <radialGradient id="sk-glow" cx="20%" cy="25%" r="45%">
      <stop offset="0%" stop-color="#701A3D" stop-opacity="0.4"/>
      <stop offset="60%" stop-color="#451126" stop-opacity="0.15"/>
      <stop offset="100%" stop-color="#10070C" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="sk-title-grad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#F8F0F3"/>
      <stop offset="60%" stop-color="#E5B5C7"/>
      <stop offset="100%" stop-color="#C77B9B"/>
    </linearGradient>
  </defs>

  <style>
    .font-sans { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; }
    .font-mono { font-family: 'JetBrains Mono', 'Fira Code', 'SF Mono', Consolas, monospace; }
  </style>

  <!-- Container -->
  <rect width="840" height="330" rx="14" fill="url(#sk-bg)" stroke="#451126" stroke-width="1.5"/>
  <rect width="840" height="330" rx="14" fill="url(#sk-glow)"/>
  <rect width="840" height="330" rx="14" fill="url(#sk-grid)"/>

  <!-- Corner Brackets -->
  <path d="M 14 24 L 14 14 L 24 14" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 826 24 L 826 14 L 816 14" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 14 306 L 14 316 L 24 316" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>
  <path d="M 826 306 L 826 316 L 816 316" fill="none" stroke="#701A3D" stroke-width="1.5" opacity="0.7"/>

  <!-- Section Pill -->
  <rect x="40" y="24" width="220" height="24" rx="12" fill="#190B12" stroke="#701A3D" stroke-width="1"/>
  <circle cx="52" cy="36" r="3.5" fill="#C77B9B">
    <animate attributeName="opacity" values="0.4;1;0.4" dur="2.2s" repeatCount="indefinite"/>
  </circle>
  <text x="64" y="39.5" class="font-mono" font-size="10" font-weight="600" fill="#E5B5C7" letter-spacing="1.2">SYSTEM // VERIFIED SKILLS</text>

  <!-- Category 1: Frontend -->
  <g transform="translate(40, 68)">
    <rect width="760" height="42" rx="8" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#E5B5C7" letter-spacing="1">FRONTEND</text>
    <line x1="125" y1="12" x2="125" y2="30" stroke="#701A3D" stroke-width="1"/>
    <text x="140" y="26" class="font-sans" font-size="12" fill="#F8F0F3">HTML5  •  CSS3  •  JavaScript (ES6+)  •  React.js  •  Next.js  •  TypeScript  •  Tailwind CSS  •  ShadCN UI</text>
  </g>

  <!-- Category 2: Backend -->
  <g transform="translate(40, 118)">
    <rect width="760" height="42" rx="8" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#E5B5C7" letter-spacing="1">BACKEND</text>
    <line x1="125" y1="12" x2="125" y2="30" stroke="#701A3D" stroke-width="1"/>
    <text x="140" y="26" class="font-sans" font-size="12" fill="#F8F0F3">Node.js  •  Express.js  •  REST APIs  •  JWT Auth  •  Refresh Tokens  •  RBAC  •  Hybrid API Cache</text>
  </g>

  <!-- Category 3: Mobile -->
  <g transform="translate(40, 168)">
    <rect width="760" height="42" rx="8" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#E5B5C7" letter-spacing="1">MOBILE</text>
    <line x1="125" y1="12" x2="125" y2="30" stroke="#701A3D" stroke-width="1"/>
    <text x="140" y="26" class="font-sans" font-size="12" fill="#F8F0F3">Flutter  •  Dart  •  Provider  •  Riverpod  •  Audio Player Engine  •  Multi-Language Support  •  Material UI</text>
  </g>

  <!-- Category 4: Databases & Cloud -->
  <g transform="translate(40, 218)">
    <rect width="760" height="42" rx="8" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#E5B5C7" letter-spacing="1">DATABASE</text>
    <line x1="125" y1="12" x2="125" y2="30" stroke="#701A3D" stroke-width="1"/>
    <text x="140" y="26" class="font-sans" font-size="12" fill="#F8F0F3">MongoDB  •  Firebase  •  Cloud Firestore  •  Firebase Analytics  •  Firebase Crashlytics</text>
  </g>

  <!-- Category 5: Tooling & Deployment -->
  <g transform="translate(40, 268)">
    <rect width="760" height="42" rx="8" fill="#190B12" stroke="#451126" stroke-width="1"/>
    <text x="16" y="26" class="font-mono" font-size="11" font-weight="700" fill="#E5B5C7" letter-spacing="1">TOOLS / OPS</text>
    <line x1="125" y1="12" x2="125" y2="30" stroke="#701A3D" stroke-width="1"/>
    <text x="140" y="26" class="font-sans" font-size="12" fill="#F8F0F3">Git  •  GitHub  •  VS Code  •  Android Studio  •  Antigravity IDE  •  Vercel Deployments  •  Google AdMob</text>
  </g>
</svg>